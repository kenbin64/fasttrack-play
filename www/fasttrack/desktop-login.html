<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastTrack: Sign in</title>
  <style>
    :root {
      --bg0: #0a1410; --bg1: #12241c; --felt: #1c3a2e; --line: #2c4a3c;
      --ink: #eef3ef; --muted: #93a89b; --amber: #e8b04b; --amber-dk: #c8912f;
      --err: #e0736a; --ok: #7fc9a0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 50% -10%, #1a3328 0%, transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg0));
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .card {
      width: 380px; max-width: calc(100vw - 32px);
      background: rgba(12, 26, 20, 0.86);
      border: 1px solid var(--line); border-radius: 16px;
      padding: 30px 30px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .brand { text-align: center; margin-bottom: 22px; }
    .brand h1 {
      margin: 0; font-size: 30px; letter-spacing: 0.5px;
      background: linear-gradient(180deg, #fff, var(--amber));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; background: rgba(0,0,0,0.25); padding: 5px; border-radius: 10px; }
    .tab {
      flex: 1; text-align: center; padding: 9px 0; border-radius: 7px; cursor: pointer;
      color: var(--muted); font-size: 14px; font-weight: 600; border: 0; background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .tab.active { background: var(--felt); color: var(--ink); }
    form { display: grid; gap: 12px; }
    form.hidden { display: none; }
    label { font-size: 12px; color: var(--muted); margin-bottom: -6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 9px;
      background: #0c1712; border: 1px solid var(--line); color: var(--ink);
      font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--amber-dk); box-shadow: 0 0 0 3px rgba(232,176,75,0.15); }
    button.go {
      margin-top: 4px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
      background: linear-gradient(180deg, var(--amber), var(--amber-dk));
      color: #241a06; font-weight: 800; font-size: 15px; letter-spacing: 0.3px;
    }
    button.go:hover { filter: brightness(1.05); }
    button.go:active { transform: translateY(1px); }
    .msg { min-height: 18px; text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .foot { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1>FastTrack</h1>
      <p>Sign in to play online</p>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-signin" type="button">Sign In</button>
      <button class="tab" id="tab-register" type="button">Create Account</button>
    </div>

    <form id="form-signin">
      <label for="si-user">Player name or email</label>
      <input id="si-user" type="text" autocomplete="username" autofocus>
      <label for="si-pass">Password</label>
      <input id="si-pass" type="password" autocomplete="current-password">
      <button class="go" type="submit">Sign In</button>
    </form>

    <form id="form-register" class="hidden">
      <label for="rg-user">Player name (unique, 3 to 20 characters)</label>
      <input id="rg-user" type="text" maxlength="20" autocomplete="off">
      <label for="rg-email">Email</label>
      <input id="rg-email" type="email" autocomplete="email">
      <label for="rg-pass">Password (min 8)</label>
      <input id="rg-pass" type="password" autocomplete="new-password">
      <label for="rg-pass2">Confirm password</label>
      <input id="rg-pass2" type="password" autocomplete="new-password">
      <button class="go" type="submit">Create Account</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="foot">One login works across every kensgames game.<br>Your player name is unique and yours.</div>
  </main>

  <script src="/fasttrack/desktop-login.js"></script>
</body>
</html>
